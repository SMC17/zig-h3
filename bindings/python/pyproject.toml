[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zig_h3"
version = "0.3.0"
description = "Python binding for SMC17/zig-h3 batch+parallel API via libzig_h3.so + ctypes + NumPy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sean Collins" }]
dependencies = ["numpy>=1.20"]

[tool.hatch.build.targets.wheel]
packages = ["zig_h3"]
