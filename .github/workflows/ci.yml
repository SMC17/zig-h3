name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-14
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: zig fmt --check
        run: zig fmt --check src/ build.zig

      - name: zig build
        run: zig build

      - name: zig build test (libh3 wrapper + pure-Zig cross-validation)
        run: zig build test --summary all

  cross-compile-sanity:
    name: cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # libh3 vendored C source cross-compiles cleanly to aarch64-linux.
          # aarch64-macos / x86_64-macos cross-compile from a Linux host hits
          # a Zig LLD-on-mach-o limitation when linking the example exe; the
          # native macos-14 runner above covers those targets natively.
          - aarch64-linux-gnu
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: zig build -Dtarget=${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }}

  windows-native:
    name: windows-latest (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: zig build (Windows native)
        run: zig build
      - name: zig build test (Windows native)
        run: zig build test --summary all

  python-binding:
    name: python-binding (libzig_h3.so + ctypes + NumPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Build shared lib (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: Install Python binding + test deps
        working-directory: bindings/python
        run: |
          pip install -e .
          pip install pytest
      - name: Run Python tests
        working-directory: bindings/python
        env:
          ZIG_H3_LIB: ${{ github.workspace }}/zig-out/lib/libzig_h3.so
        run: pytest tests/ -v

  go-binding:
    name: go-binding (cgo + libzig_h3.so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Build shared lib (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: Run Go tests
        working-directory: bindings/go/zigh3
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/zig-out/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/zig-out/lib
        run: |
          go mod init zigh3 2>/dev/null || true
          go test -v ./...

  coverage:
    name: line-coverage (kcov)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install kcov + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov jq

      - name: Measure line coverage of src/root.zig
        run: bash tools/coverage.sh

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-out/coverage-driver/
